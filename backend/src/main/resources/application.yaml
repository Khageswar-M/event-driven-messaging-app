
spring:
  application:
    name: backend

  datasource:
    url: jdbc:h2:mem:messagedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  cors:
    allowed-origin: "http://localhost:5173"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
